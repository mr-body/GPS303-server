services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: gps-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gpsdb}
      POSTGRES_USER: ${POSTGRES_USER:-gps}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_this_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gps} -d ${POSTGRES_DB:-gpsdb}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - gps-network

  gps-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gps-server
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      HTTP_PORT: 3000
      TCP_PORT: 5001
      DATABASE_URL: postgresql://${POSTGRES_USER:-gps}:${POSTGRES_PASSWORD:-change_this_password}@timescaledb:5432/${POSTGRES_DB:-gpsdb}
      DB_POOL_MAX: ${DB_POOL_MAX:-20}
    ports:
      - "${HTTP_PORT:-3000}:3000"
      - "${TCP_PORT:-5001}:5001"
    networks:
      - gps-network

volumes:
  timescale_data:

networks:
  gps-network:
    driver: bridge
